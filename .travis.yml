language: python
dist: xenial
os: linux
python:
  - 3.8
  - 3.9

before_install:
  - git clone --depth 1 git://github.com/pyvista/gl-ci-helpers.git
  - source ./gl-ci-helpers/travis/setup_headless_display.sh
  - set -x
  - sudo apt update && sudo apt install python-qt4 libgl1-mesa-glx
  - sudo apt-get install libxcb-xinerama0 pyqt5-dev-tools
  - sudo apt-get install -y xvfb
  - export DISPLAY=:99.0
  - export PYVISTA_OFF_SCREEN=True
  - which Xvfb
  - Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
  - sleep 3
  - set +x
  - exec "$@"
  - python3 -m pip install pyqt5
  
install:
  - python3 -m pip install -r requirements.txt --use-feature=2020-resolver
  - python3 -m pip install .
  - python3 -m pip install -r requirements_dev.txt

script:
  - pytest -v
  - pytest -v ./tests/build_examples.py
        
