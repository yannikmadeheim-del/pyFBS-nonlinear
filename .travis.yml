dist: xenial

os:
  - linux

language: python
python:
  - "3.8.5"
  - "3.9.7"
  
before_install:
  - set -x
  - sudo apt update && sudo apt install python-qt4 libgl1-mesa-glx
  - sudo apt-get install -y xvfb
  - export DISPLAY=:99.0
  - export PYVISTA_OFF_SCREEN=True
  - which Xvfb
  - Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
  - sleep 3
  - set +x
  
install:
  - pip install .
  - pip install -r requirements_dev.txt

jobs:
  include:
    - stage: "Test"     
      name: "Compile"    
      script:
        - pytest -v
        - pytest -v ./tests/build_examples.py
        